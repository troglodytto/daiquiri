<text xml:space="preserve" x="40.0" y="412.5" text-anchor="start" font-size="20" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="bold" fill="#6741d9">Edges[i].Parent &lt; i</text>
<text xml:space="preserve" x="300.0" y="411.4" text-anchor="start" font-size="15" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">always, for every i</text>
<text xml:space="preserve" x="40.0" y="440.4" text-anchor="start" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#1e1e1e">Build only ever scans backwards from i, so the invariant holds by construction. Almost everything</text>
<text xml:space="preserve" x="40.0" y="459.3" text-anchor="start" font-size="14" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#1e1e1e">I would otherwise have to defend with code falls out of that one line:</text>
<text xml:space="preserve" x="56.0" y="502.4" text-anchor="start" font-size="14" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="normal" fill="#6741d9">cycles are structurally impossible</text>
<text xml:space="preserve" x="540.0" y="501.3" text-anchor="start" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">no visited set, no cycle check, no error path to test</text>
<text xml:space="preserve" x="56.0" y="532.4" text-anchor="start" font-size="14" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="normal" fill="#6741d9">Findings is already topological</text>
<text xml:space="preserve" x="540.0" y="531.3" text-anchor="start" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">sorting by time IS the topological sort</text>
<text xml:space="preserve" x="56.0" y="562.4" text-anchor="start" font-size="14" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="normal" fill="#6741d9">Children(i) scans forward from i+1</text>
<text xml:space="preserve" x="540.0" y="561.3" text-anchor="start" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">no adjacency lists, no allocation</text>
<text xml:space="preserve" x="56.0" y="592.4" text-anchor="start" font-size="14" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-weight="normal" fill="#6741d9">RootOf is an integer loop</text>
<text xml:space="preserve" x="540.0" y="591.3" text-anchor="start" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">2.3 ns and zero allocations at n=1000</text>
<polyline points="40.0,624.0 1170.0,624.0" fill="none" stroke="#dee2e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="40.0" y="655.3" text-anchor="start" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">n counts findings, so it tracks distinct failure modes. A cluster emitting 10× the events has roughly the same n.</text>
<text xml:space="preserve" x="40.0" y="672.9" text-anchor="start" font-size="13" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" fill="#868e96">Observed across these six captures: 20,000 records in, 3 to 10 findings out.</text>
</svg>